<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found</title>
  <script>
    (function () {
      var p = window.location.pathname;
      // GitHub Pages project paths are case-sensitive; the Athar app lives at /Athar/.
      var fixed = p.replace(/^\/athar(?=\/|$)/i, '/Athar');
      if (fixed !== p) {
        window.location.replace(fixed + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    body { font-family: sans-serif; background: #faf7f0; color: #0F3D2A; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; margin: 0 0 .5rem; }
    a { color: #0F3D2A; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <p><a href="/">Back to homepage</a> &middot; <a href="/Athar/">Athar app</a></p>
  </div>
</body>
</html>
